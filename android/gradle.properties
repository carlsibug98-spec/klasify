# Capped for low-RAM build machines (needs ~2.5GB total, not 8G+4G):
# the app has no native code to compile and Kotlin sources are small.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1024m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Built-in Kotlin (AGP 9) so plugins stop applying the legacy Kotlin Gradle
# Plugin; required for Flutter's future plan to fail builds that use KGP.
# android_file_picker (file_picker 13.x) only enables KGP when this is false,
# so the KGP deprecation warning disappears with this set to true.
android.builtInKotlin=true
# :android_file_picker cannot close its incremental caches on the Windows
# runner ("this and base files have different roots: C:\...FileInfo.kt and
# D:\...\android") because the pub cache and the project live on different
# drives. Disable incremental Kotlin so CI's assembleDebug survives; locally
# both paths share C:\ so this only costs a slower plugin re-compile.
kotlin.incremental=false

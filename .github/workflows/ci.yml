name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not `stable`. The captures in test/goldens are rendered by the
  # Flutter engine, so a different SDK re-rasterises the text and fails the
  # design tests with 1-4% pixel drift even when no UI changed.
  FLUTTER_VERSION: '3.47.9'

jobs:
  checks:
    name: analyze + test
    # Windows is deliberate: the goldens were recorded on Windows. Linux and
    # macOS use different rasterisation and report drift for the same reason a
    # version bump does.
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify the pinned toolchain
        shell: pwsh
        run: |
          # `--machine` emits setup chatter before the JSON on a cold cache, so
          # match the human-readable version line instead of parsing JSON.
          $out = flutter --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'flutter --version failed' }
          if ($out -notmatch [regex]::Escape("Flutter $env:FLUTTER_VERSION")) {
            throw "Resolved Flutter is not the pinned $env:FLUTTER_VERSION. Re-record test/goldens before changing this pin."
          }
          $out

      - name: Install Tesseract (OCR benchmark stand-in)
        shell: pwsh
        run: |
          # bench5/6/7 shell out to the tesseract CLI because the native ONNX
          # engine cannot run in the test VM. Without it those tests self-skip,
          # which would drop the coverage that caught the Windows fixture-key
          # regression in 2026-11.
          if (-not (Get-Command tesseract -ErrorAction SilentlyContinue)) {
            choco install tesseract --no-progress -y
            $exe = Join-Path ${env:ProgramFiles} 'Tesseract-OCR\tesseract.exe'
            if (-not (Test-Path $exe)) { throw 'tesseract.exe is missing after install' }
            $dir = Split-Path $exe
            $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$dir;$env:PATH"
          }
          tesseract --version

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        # The 11 tracked prefer_const_constructors hints are informational
        # cosmetics — left intentionally (see the P1 UI work). Gate on real
        # problems only infos stay silent.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/app-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failures
          path: |
            test/failures/
            build/bench*.json
          if-no-files-found: ignore
          retention-days: 7

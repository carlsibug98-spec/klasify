services:
  mysql:
    image: mysql:8
    container_name: klasify-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: klasify_dev
      MYSQL_DATABASE: klasify_sync
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - klasify_mysql_data:/var/lib/mysql
      - ../docs/mysql_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pklasify_dev"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: klasify-api
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      KLASIFY_DB_HOST: mysql
      KLASIFY_DB_PORT: "3306"
      KLASIFY_DB_NAME: klasify_sync
      KLASIFY_DB_USER: root
      KLASIFY_DB_PASS: klasify_dev
      KLASIFY_JWT_SECRET: change-this-to-a-long-random-string-in-production
      GOOGLE_CLIENT_ID: ""
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  klasify_mysql_data:
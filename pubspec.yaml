name: klasify
description: A local-first weekly class timetable with offline OCR import, class reminders, and an Android home-screen widget.
publish_to: 'none'
version: 1.4.4+14

environment:
  # paddle_ocr_native requires Dart 3.12 and Flutter 3.44 or newer.
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.5
  # 13.x dropped the Android Kotlin Gradle Plugin application so the app can
  # build with android.builtInKotlin=true (Flutter 3.47 Built-in Kotlin).
  file_picker: ^13.0.0
  pdfrx: ^2.6.5
  shared_preferences: ^2.3.0
  sqflite: ^2.4.2
  flutter_local_notifications: ^21.0.0
  timezone: 0.11.2
  flutter_timezone: ^5.0.0
  paddle_ocr_native: 0.1.1
  # Opt-in crash reporting: inactive unless a DSN is compiled in with
  # --dart-define=KLASIFY_SENTRY_DSN=... (see lib/services/crash_reporting.dart).
  sentry_flutter: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/klasify_logo.png
    - assets/klasify_logo_light.png
